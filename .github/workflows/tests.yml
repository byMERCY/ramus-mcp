name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows: the fonts the layout code measures text with (Segoe UI, Arial) are there.
    runs-on: windows-latest
    strategy:
      matrix:
        # 3.12 is the least it needs; on a machine with no Python, Claude Desktop's uv takes the
        # newest one, so that is tested too.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
