name: release

# Push a tag such as v1.0.0: the tests run, the Claude Desktop extension is built and a release
# is made with it attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python tools/build_mcpb.py
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.mcpb
          generate_release_notes: true
